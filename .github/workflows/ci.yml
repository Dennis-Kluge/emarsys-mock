name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -timeout 300s ./...

      - name: test (race)
        run: go test -race -timeout 600s ./...

      # The deployment promise is a single static binary. If CGO ever creeps
      # back in through a dependency, this is where it shows up.
      - name: cross-compile without CGO
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            for pkg in ./cmd/emarsys-mock ./cmd/emarsys-record; do
              GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
                go build -trimpath -o /dev/null "$pkg"
            done
            echo "built $target"
          done

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the scratch image
        run: docker build -t emarsys-mock:ci .

      # The image has no shell, no zoneinfo and no volume, so this run is the
      # real check that the binary carries everything it needs.
      - name: run it and exercise the definition of done
        run: |
          # From outside the container a request does not arrive over loopback,
          # so the control plane and the dashboard need a token rather than
          # their localhost-only default.
          docker run -d --name mock -p 8080:8080 -e CTL_TOKEN=ci-token emarsys-mock:ci
          CTL_TOKEN=ci-token ./scripts/smoke.sh http://localhost:8080
          docker logs mock
          docker rm -f mock
